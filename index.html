<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikewatching - Boston Bike Traffic Visualization</title>

    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="global.css">

    <!-- Map CSS -->
    <link rel="stylesheet" href="map.css">

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <!-- Mapbox GL JS as ES Module -->
    <script src="map.js" type="module"></script>
</head>
<body>
    <header>
        <h1>🚲 Bikewatching</h1>
        <p>Visualizing BlueBike traffic patterns in Boston and Cambridge</p>

        <!-- Time filter slider -->
        <label class="time-filter">
            Filter by time:
            <input type="range" id="time-slider" min="-1" max="1440" value="-1" step="1">
            <div class="time-display">
                <time id="selected-time"></time>
                <em id="any-time">(any time)</em>
            </div>
        </label>
    </header>

    <main>
        <div id="map">
            <svg></svg>
        </div>
    </main>

    <!-- Legend - Horizontal with LEGEND: label and colored circles -->
    <div class="legend">
        <span class="legend-label">LEGEND:</span>
        <div class="legend-items">
            <div class="legend-item">
                <span class="swatch swatch-departures"></span>
                <span>More departures</span>
            </div>
            <div class="legend-item">
                <span class="swatch swatch-balanced"></span>
                <span>Balanced</span>
            </div>
            <div class="legend-item">
                <span class="swatch swatch-arrivals"></span>
                <span>More arrivals</span>
            </div>
        </div>
    </div>
</body>
</html>
